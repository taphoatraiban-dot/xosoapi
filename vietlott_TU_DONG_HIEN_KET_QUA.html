<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b50014"><title>Kết quả Vietlott | XOSOAPI</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,Arial,sans-serif;background:#f5f6f8;color:#1b2531}header{background:linear-gradient(100deg,#aa0014,#ed2033);color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}header strong{font-size:23px}header small{display:block;font-size:12px;opacity:.9}header a{color:#fff;text-decoration:none;border:1px solid #ffb9c0;padding:8px;border-radius:9px}main{max-width:900px;margin:auto;padding:12px}.intro{text-align:center;color:#ae061b;font-weight:850;font-size:21px;margin:12px 0}.tabs{display:flex;overflow-x:auto;gap:0;border:1px solid #e2c6c8;border-radius:12px 12px 0 0;background:#fff;scrollbar-width:thin}.tabs button{flex:none;min-width:95px;padding:13px 12px;border:0;border-right:1px solid #eee;background:white;color:#333;font:inherit;cursor:pointer}.tabs button[aria-selected=true]{background:#bc071c;color:#fff;font-weight:800}.panel{background:#fff;border:1px solid #e2c6c8;border-top:0;border-radius:0 0 13px 13px;overflow:hidden}.bar{background:#bd071d;color:#fff;text-align:center;font-size:19px;font-weight:800;padding:13px}.meta{background:#ffe6e8;text-align:center;padding:12px;font-weight:750;color:#9e0a1d}.content{padding:20px 12px;text-align:center}.jackpot{font-size:19px;font-weight:700;margin:8px 0 16px}.jackpot strong{color:#d10b20;font-size:clamp(22px,6vw,31px)}.balls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:15px auto 22px}.ball{width:clamp(42px,11vw,65px);height:clamp(42px,11vw,65px);border-radius:50%;background:#d22131;color:#fff;display:grid;place-items:center;font-size:clamp(20px,5vw,29px);font-weight:850}.ball.special{background:#e6a100}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{border:1px solid #ddd;padding:11px 5px;text-align:center}th{background:#fff3f4}tbody tr:nth-child(even){background:#f9f9f9}.message{padding:35px 16px;text-align:center;color:#677181;line-height:1.7}.status{font-size:13px;padding:10px 12px;color:#536070;text-align:center}.refresh{border:0;background:#bd071d;color:white;border-radius:9px;padding:11px 17px;font-weight:750;cursor:pointer}.tools{text-align:center;margin:14px}.foot{font-size:12px;text-align:center;color:#777;margin:25px 0}.muted{color:#637083;font-size:13px}.prize{font-weight:700;color:#ba001b}@media(max-width:400px){th,td{font-size:13px;padding:9px 3px}}
</style></head><body><header><div><strong>🎱 XOSOAPI</strong><small>Kết quả xổ số Vietlott</small></div><a href="./index.html">Trang chủ</a></header><main><div class="intro">KẾT QUẢ XỔ SỐ VIETLOTT</div><nav id="tabs" class="tabs" aria-label="Loại xổ số"></nav><section class="panel"><div class="bar" id="heading">Kết quả Vietlott</div><div class="meta" id="drawDate">Đang tải kỳ quay mới nhất...</div><div id="result" class="message" aria-live="polite">Đang kết nối dữ liệu...</div><div class="status" id="status"></div></section><div class="tools"><button class="refresh" id="reload">↻ Cập nhật kết quả</button></div><p class="foot">Chỉ hiển thị dữ liệu thực từ API. Không tạo kết quả ngẫu nhiên.</p></main>
<script>
'use strict';
// API phải trả JSON kết quả Vietlott; không sử dụng API xổ số ba miền thay thế.
// Có thể thay endpoint này bằng URL Vietlott đã triển khai của bạn.
const API='https://zigpqddlhvjbjrwhfhaa.supabase.co/functions/v1/vietlott';
const games=[['mega645','Mega 6/45'],['power655','Power 6/55'],['max3d','Max 3D'],['max3dpro','Max 3D Pro'],['lotto535','Lotto 5/35'],['keno','Keno'],['dt123','Điện toán 123'],['dt6x36','Điện toán 6x36']];
const el=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected='mega645',seq=0,cache=null;
const nameOf=id=>games.find(g=>g[0]===id)?.[1]||id;
function tabs(){el('tabs').innerHTML=games.map(([id,name])=>`<button type="button" data-game="${id}" aria-selected="${id===selected}">${safe(name)}</button>`).join('');el('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.game;tabs();show();}));}
function records(json){let a=Array.isArray(json)?json:Array.isArray(json?.data)?json.data:Array.isArray(json?.results)?json.results:Array.isArray(json?.draws)?json.draws:[json?.data||json];return a.filter(x=>x&&typeof x==='object');}
function normalizeGame(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function getGame(x){return normalizeGame(x.game||x.type||x.product||x.game_type||x.game_code);}
function drawTime(x){return String(x.draw_date||x.date||x.drawDate||x.draw_time||'');}
function numberList(x){const n=x.numbers||x.result_numbers||x.winning_numbers||x.results;return Array.isArray(n)?n:typeof n==='string'?n.trim().split(/[\s,;|\-]+/).filter(Boolean):[];}
function show(){el('heading').textContent='Kết quả '+nameOf(selected);if(!cache){el('drawDate').textContent='Kỳ quay mới nhất';el('result').innerHTML='<div class="message">Chưa tải được dữ liệu.</div>';return;}const a=records(cache).filter(x=>getGame(x)===selected).sort((a,b)=>drawTime(b).localeCompare(drawTime(a)));const x=a[0];if(!x){el('drawDate').textContent='Kỳ quay mới nhất';el('result').innerHTML='<div class="message">Chưa có kết quả xác thực cho '+safe(nameOf(selected))+'.</div>';return;}const nums=numberList(x);const valid=nums.length>0&&nums.every(n=>/^\d{1,3}$/.test(String(n)));el('drawDate').textContent=[x.draw_id||x.draw_no||x.draw_number?'Kỳ '+(x.draw_id||x.draw_no||x.draw_number):'',drawTime(x)].filter(Boolean).join(' · ')||'Kỳ quay mới nhất';if(!valid){el('result').innerHTML='<div class="message">Nguồn dữ liệu chưa có dãy số hợp lệ cho kỳ này.</div>';return;}const jackpot=x.jackpot??x.jackpot_value;const prize=x.prizes||x.prize_table||x.prize_details;let rows='';if(Array.isArray(prize))rows=prize.map(p=>`<tr><td>${safe(p.name||p.prize||p.tier||'—')}</td><td>${safe(p.match||p.matches||'—')}</td><td>${safe(p.winners??p.count??'—')}</td><td class="prize">${safe(p.amount??p.value??'—')}</td></tr>`).join('');else if(prize&&typeof prize==='object')rows=Object.entries(prize).map(([k,v])=>`<tr><td>${safe(k)}</td><td colspan="3">${safe(typeof v==='object'?JSON.stringify(v):v)}</td></tr>`).join('');el('result').innerHTML=`<div class="content">${jackpot!=null&&Number.isFinite(Number(jackpot))?`<div class="jackpot">Giá trị Jackpot: <strong>${Number(jackpot).toLocaleString('vi-VN')} đồng</strong></div>`:''}<div class="balls">${nums.map((n,i)=>`<span class="ball ${x.special_index===i?'special':''}">${safe(n)}</span>`).join('')}</div>${rows?`<div class="tablewrap"><table><thead><tr><th>Giải thưởng</th><th>Trùng khớp</th><th>Số lượng giải</th><th>Giá trị giải</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="muted">Chưa có bảng cơ cấu giải thưởng từ nguồn dữ liệu.</div>'}</div>`;}
async function load(){const token=++seq;el('status').textContent='Đang tự động cập nhật kết quả…';try{const r=await fetch(API+'?latest=1',{headers:{Accept:'application/json'},cache:'no-store'});if(!r.ok)throw new Error('API trả mã '+r.status);const j=await r.json();if(token!==seq)return;if(j?.success===false)throw Error(j.error||'API báo lỗi');cache=j;show();el('status').textContent='Đã cập nhật dữ liệu từ API.';}catch(e){if(token!==seq)return;cache=null;show();el('status').textContent='Chưa kết nối được nguồn Vietlott ('+e.message+'). Cần triển khai API Vietlott để tự hiển thị kết quả.';}}
el('reload').addEventListener('click',load);tabs();load();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(()=>{if(!document.hidden)load()},120000);
</script></body></html>
