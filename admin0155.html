<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XOSOAPI Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111f;--panel:#0e1a2b;--panel2:#0a1524;--text:#f4f7fb;--muted:#8fa0b7;--line:#233853;--green:#13d48e;--red:#ef4444;--gold:#f4b740}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.top{height:76px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#08121f}
.brand{font-size:21px;font-weight:900}.wrap{max-width:980px;margin:auto;padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h1,h2{margin:0 0 10px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:#17263a;color:#fff;padding:11px 14px;border-radius:11px;font-weight:900;cursor:pointer}.btn.green{background:#0f9f71}.btn:disabled{opacity:.55;cursor:not-allowed}
.order{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.label{font-size:12px;color:var(--muted);margin-bottom:3px}.value{font-weight:800;word-break:break-word}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#3a2d09;color:#ffd977;font-weight:900;font-size:12px}.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.notice{display:none;padding:12px;border-radius:12px;margin-top:12px}.notice.ok{display:block;background:#0b3424;border:1px solid #176b49;color:#83f2bd}.notice.err{display:block;background:#3b1515;border:1px solid #7f1d1d;color:#fecaca}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;margin-top:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">✦ XOSOAPI Admin</div>
  <button class="btn" id="backBtn">Dashboard</button>
</header>

<main class="wrap">
<section class="card">
  <h1>Yêu cầu nâng cấp</h1>
  <div class="muted" id="adminEmail">Đang kiểm tra quyền admin...</div>
  <div id="notice" class="notice"></div>
  <div id="orders"></div>
</section>
</main>

<script>
const SUPABASE_URL="https://zigpqddlhvjbjrwhfhaa.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_U8VKihgNe0M7ff5KHB3Mvg_04ifZ7ni";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const ordersEl=document.getElementById("orders");
const notice=document.getElementById("notice");
const adminEmail=document.getElementById("adminEmail");
document.getElementById("backBtn").onclick=()=>location.href="./dashboard.html";

function showNotice(t,k="err"){notice.className="notice "+k;notice.textContent=t}
function fmt(n){return Number(n||0).toLocaleString("vi-VN")}
function fmtDate(v){if(!v)return "-";try{return new Date(v).toLocaleString("vi-VN")}catch{return v}}

async function isAdmin(user){
  const {data,error}=await sb.from("admin_users")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();
  if(error) return false;
  return !!data;
}

async function approve(id,btn){
  btn.disabled=true;
  btn.textContent="Đang duyệt...";
  const {error}=await sb.rpc("approve_upgrade_request",{p_request_id:id});
  if(error){
    btn.disabled=false;
    btn.textContent="Duyệt";
    showNotice("Duyệt thất bại: "+error.message);
    return;
  }
  showNotice("Đã duyệt đơn #"+id+" và cộng thời hạn gói.","ok");
  await loadOrders();
}

async function loadOrders(){
  ordersEl.innerHTML="Đang tải...";
  const {data,error}=await sb.from("upgrade_requests")
    .select("id,user_id,plan_code,amount,duration_months,transfer_note,status,created_at")
    .eq("status","pending")
    .order("created_at",{ascending:true});

  if(error){
    ordersEl.innerHTML="";
    showNotice("Không đọc được đơn: "+error.message);
    return;
  }

  if(!data?.length){
    ordersEl.innerHTML='<div class="empty">Hiện không có đơn pending.</div>';
    return;
  }

  ordersEl.innerHTML="";
  for(const o of data){
    const div=document.createElement("div");
    div.className="order";
    div.innerHTML=`
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
        <h2 style="margin:0">Đơn #${o.id}</h2>
        <span class="status">${o.status}</span>
      </div>
      <div class="grid" style="margin-top:12px">
        <div><div class="label">Gói</div><div class="value">${String(o.plan_code||"").toUpperCase()}</div></div>
        <div><div class="label">Số tiền</div><div class="value">${fmt(o.amount)}đ</div></div>
        <div><div class="label">Thời hạn</div><div class="value">${o.duration_months||1} tháng</div></div>
        <div><div class="label">Ngày tạo</div><div class="value">${fmtDate(o.created_at)}</div></div>
        <div style="grid-column:1/-1"><div class="label">Nội dung chuyển khoản</div><div class="value">${o.transfer_note||"-"}</div></div>
        <div style="grid-column:1/-1"><div class="label">User ID</div><div class="value">${o.user_id}</div></div>
      </div>
      <div class="actions"><button class="btn green approveBtn">Duyệt</button></div>
    `;
    div.querySelector(".approveBtn").onclick=(e)=>approve(o.id,e.currentTarget);
    ordersEl.appendChild(div);
  }
}

(async()=>{
  const {data:{session},error}=await sb.auth.getSession();
  if(error){showNotice(error.message);return}
  if(!session?.user){location.href="./login.html";return}

  adminEmail.textContent=session.user.email||"";
  const ok=await isAdmin(session.user);
  if(!ok){
    ordersEl.innerHTML='<div class="empty">Tài khoản này chưa có quyền Admin.</div>';
    showNotice("Chưa có quyền Admin.");
    return;
  }
  await loadOrders();
})();
</script>
</body>
</html>
