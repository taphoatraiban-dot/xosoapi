<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XOSOAPI Tester</title>
<style>
:root{
  --bg:#0b1020; --panel:#111827; --panel2:#0f172a; --text:#e5e7eb;
  --muted:#94a3b8; --line:#263247; --blue:#2563eb; --green:#22c55e;
  --red:#ef4444; --amber:#f59e0b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#0b1020,#111827 45%,#0b1020);
  color:var(--text);
  min-height:100vh;
}
.wrap{max-width:900px;margin:auto;padding:20px}
.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:16px;flex-wrap:wrap
}
.brand h1{margin:0;font-size:30px}
.brand p{margin:5px 0 0;color:var(--muted)}
.nav a{
  display:inline-block;text-decoration:none;color:#dbeafe;
  border:1px solid var(--line);padding:9px 12px;border-radius:10px;background:#111827
}
.card{
  background:rgba(17,24,39,.96);border:1px solid var(--line);
  border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 12px 40px rgba(0,0,0,.18)
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{display:block;font-size:14px;color:#cbd5e1;margin-bottom:7px;font-weight:650}
input,select{
  width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);
  background:#0a1221;color:var(--text);font-size:16px;outline:none
}
input:focus,select:focus{border-color:#3b82f6}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
button{
  border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer
}
.primary{background:var(--blue);color:white}
.secondary{background:#1f2937;color:#e5e7eb;border:1px solid var(--line)}
.status{
  display:none;margin-top:14px;padding:11px 13px;border-radius:10px;font-weight:650
}
.status.ok{display:block;background:#0c2c1a;border:1px solid #14532d;color:#86efac}
.status.err{display:block;background:#321313;border:1px solid #7f1d1d;color:#fecaca}
.status.wait{display:block;background:#2c210b;border:1px solid #78350f;color:#fde68a}
.meta{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px
}
.meta div{background:#0a1221;border:1px solid var(--line);border-radius:10px;padding:10px}
.meta b{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
pre{
  margin:0;background:#070d18;border:1px solid var(--line);border-radius:14px;
  padding:15px;overflow:auto;max-height:520px;white-space:pre-wrap;word-break:break-word;
  color:#dbeafe;font-size:13px;line-height:1.5
}
.small{font-size:13px;color:var(--muted)}
.endpoint{word-break:break-all;color:#93c5fd}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.quick button{flex:1;min-width:120px}
.quick .all{background:#7c3aed;color:white}
.quick .mn,.quick .mt,.quick .mb{background:#1f2937;color:#e5e7eb;border:1px solid var(--line)}
.results-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.result-card{background:#0a1221;border:1px solid var(--line);border-radius:14px;padding:14px}
.result-card h3{margin:0 0 10px;font-size:16px}
.result-card pre{max-height:320px}
@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .meta{grid-template-columns:1fr 1fr}
  .brand h1{font-size:26px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>XOSOAPI Tester</h1>
      <p>Kiểm tra API MN / MT / MB trực tiếp trên trình duyệt.</p>
    </div>
    <div class="nav">
      <a href="./">← Tài liệu API</a>
    </div>
  </div>

  <section class="card">
    <div class="grid">
      <div>
        <label for="region">Miền</label>
        <select id="region">
          <option value="MN">MN — Miền Nam</option>
          <option value="MT">MT — Miền Trung</option>
          <option value="MB">MB — Miền Bắc</option>
        </select>
      </div>

      <div>
        <label for="date">Ngày</label>
        <input id="date" type="date">
      </div>

      <div class="full">
        <label for="key">API key</label>
        <input id="key" type="password" placeholder="Nhập API key của anh">
        <div class="small" style="margin-top:6px">Key chỉ dùng trong trình duyệt của anh và không được ghi sẵn trong file này.</div>
      </div>
    </div>

    <div class="buttons">
      <button class="primary" id="testBtn">Test API</button>
      <button class="secondary" id="copyBtn">Copy URL</button>
      <button class="secondary" id="clearBtn">Xóa kết quả</button>
    </div>

    <div class="quick">
      <button class="mn" data-region="MN">Test nhanh MN</button>
      <button class="mt" data-region="MT">Test nhanh MT</button>
      <button class="mb" data-region="MB">Test nhanh MB</button>
      <button class="all" id="testAllBtn">Test cả 3 miền</button>
    </div>

    <div id="status" class="status"></div>

    <div class="meta" id="meta" style="display:none">
      <div><b>HTTP</b><span id="mHttp">-</span></div>
      <div><b>Thời gian</b><span id="mTime">-</span></div>
      <div><b>Cache</b><span id="mCache">-</span></div>
      <div><b>Số đài</b><span id="mCount">-</span></div>
    </div>
  </section>

  <section class="card">
    <label>URL đang gọi</label>
    <div id="urlPreview" class="endpoint">Chưa tạo URL</div>
  </section>

  <section class="card">
    <label>Kết quả JSON</label>
    <pre id="output">Chưa có kết quả.</pre>
  </section>

  <section class="card" id="allResultsCard" style="display:none">
    <label>Kết quả kiểm tra 3 miền</label>
    <div class="results-grid" id="allResults"></div>
  </section>
</div>

<script>
const ENDPOINT = "https://zigpqddlhvjbjrwhfhaa.supabase.co/functions/v1/xosoapi";

const regionEl = document.getElementById("region");
const dateEl = document.getElementById("date");
const keyEl = document.getElementById("key");
const outputEl = document.getElementById("output");
const statusEl = document.getElementById("status");
const urlPreviewEl = document.getElementById("urlPreview");
const metaEl = document.getElementById("meta");

function localDateString(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
dateEl.value = localDateString();

function buildUrl(maskKey=false){
  const region = regionEl.value;
  const date = dateEl.value;
  const key = keyEl.value.trim();
  const shownKey = maskKey && key ? "••••••••" : key;
  return `${ENDPOINT}?region=${encodeURIComponent(region)}&date=${encodeURIComponent(date)}&key=${encodeURIComponent(shownKey)}`;
}

function updatePreview(){
  urlPreviewEl.textContent = buildUrl(true);
}
regionEl.addEventListener("change", updatePreview);
dateEl.addEventListener("change", updatePreview);
keyEl.addEventListener("input", updatePreview);
updatePreview();

document.getElementById("testBtn").addEventListener("click", async () => {
  const key = keyEl.value.trim();
  const date = dateEl.value;

  if (!date) {
    statusEl.className = "status err";
    statusEl.textContent = "Chưa chọn ngày.";
    return;
  }
  if (!key) {
    statusEl.className = "status err";
    statusEl.textContent = "Chưa nhập API key.";
    return;
  }

  const url = buildUrl(false);
  urlPreviewEl.textContent = buildUrl(true);
  outputEl.textContent = "Đang gọi API...";
  statusEl.className = "status wait";
  statusEl.textContent = "Đang kiểm tra API...";
  metaEl.style.display = "none";

  const started = performance.now();

  try {
    const res = await fetch(url, { method:"GET" });
    const elapsed = Math.round(performance.now() - started);
    const text = await res.text();

    let data;
    try { data = JSON.parse(text); } catch { data = { raw:text }; }

    outputEl.textContent = JSON.stringify(data, null, 2);
    statusEl.className = res.ok && data.success !== false ? "status ok" : "status err";
    statusEl.textContent = res.ok && data.success !== false
      ? "API hoạt động bình thường."
      : `API trả lỗi HTTP ${res.status}.`;

    document.getElementById("mHttp").textContent = res.status;
    document.getElementById("mTime").textContent = elapsed + " ms";
    document.getElementById("mCache").textContent = data.cached === true ? "Có" : "Không";
    document.getElementById("mCount").textContent = data.count ?? "-";
    metaEl.style.display = "grid";
  } catch (err) {
    outputEl.textContent = String(err);
    statusEl.className = "status err";
    statusEl.textContent = "Không gọi được API. Kiểm tra mạng hoặc CORS.";
    metaEl.style.display = "none";
  }
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  const key = keyEl.value.trim();
  if (!key) {
    statusEl.className = "status err";
    statusEl.textContent = "Nhập API key trước khi copy URL.";
    return;
  }
  await navigator.clipboard.writeText(buildUrl(false));
  statusEl.className = "status ok";
  statusEl.textContent = "Đã copy URL API.";
});

document.getElementById("clearBtn").addEventListener("click", () => {
  outputEl.textContent = "Chưa có kết quả.";
  statusEl.className = "status";
  statusEl.textContent = "";
  metaEl.style.display = "none";
});

async function callRegion(region){
  const key = keyEl.value.trim();
  const date = dateEl.value;

  if (!date) throw new Error("Chưa chọn ngày.");
  if (!key) throw new Error("Chưa nhập API key.");

  const url = `${ENDPOINT}?region=${encodeURIComponent(region)}&date=${encodeURIComponent(date)}&key=${encodeURIComponent(key)}`;
  const started = performance.now();
  const res = await fetch(url, { method:"GET" });
  const elapsed = Math.round(performance.now() - started);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = { raw:text }; }

  return {
    region,
    status: res.status,
    ok: res.ok && data.success !== false,
    elapsed,
    data
  };
}

document.querySelectorAll(".quick button[data-region]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const region = btn.dataset.region;
    regionEl.value = region;
    updatePreview();
    document.getElementById("testBtn").click();
  });
});

document.getElementById("testAllBtn").addEventListener("click", async () => {
  const key = keyEl.value.trim();
  const date = dateEl.value;
  const box = document.getElementById("allResultsCard");
  const list = document.getElementById("allResults");

  if (!date) {
    statusEl.className = "status err";
    statusEl.textContent = "Chưa chọn ngày.";
    return;
  }
  if (!key) {
    statusEl.className = "status err";
    statusEl.textContent = "Chưa nhập API key.";
    return;
  }

  statusEl.className = "status wait";
  statusEl.textContent = "Đang kiểm tra cả 3 miền...";
  // Xóa trạng thái của lần test đơn trước đó để tránh còn hiện HTTP 401 cũ.
  metaEl.style.display = "none";
  outputEl.textContent = "Đang kiểm tra cả 3 miền...";
  box.style.display = "block";
  list.innerHTML = '<div class="result-card">Đang tải MN...</div><div class="result-card">Đang tải MT...</div><div class="result-card">Đang tải MB...</div>';

  const regions = ["MN","MT","MB"];
  const results = [];

  for (const region of regions){
    try{
      results.push(await callRegion(region));
    }catch(err){
      results.push({
        region,
        status: "-",
        ok: false,
        elapsed: "-",
        data: { success:false, error:String(err) }
      });
    }
  }

  const allOk = results.every(r => r.ok);
  statusEl.className = allOk ? "status ok" : "status err";
  statusEl.textContent = allOk
    ? "Cả 3 miền đều hoạt động bình thường."
    : "Có ít nhất một miền đang lỗi.";

  // Hiển thị tóm tắt rõ ràng thay vì giữ lại meta của lần test đơn.
  outputEl.textContent = JSON.stringify({
    success: allOk,
    date,
    results: results.map(r => ({
      region: r.region,
      http: r.status,
      ok: r.ok,
      time_ms: r.elapsed,
      cached: r.data?.cached ?? false,
      count: r.data?.count ?? null
    }))
  }, null, 2);

  list.innerHTML = results.map(r => `
    <div class="result-card">
      <h3>${r.region} — HTTP ${r.status} — ${r.elapsed} ms — ${r.ok ? "OK" : "LỖI"}</h3>
      <pre>${escapeHtml(JSON.stringify(r.data, null, 2))}</pre>
    </div>
  `).join("");
});

function escapeHtml(str){
  return str.replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[ch]);
}

</script>
</body>
</html>
