name: XOSOAPI static smoke checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify HTML and inline JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const files=['index.html','thong-ke-2-so.html','thong-ke-3-so.html','thong-ke-4-so.html'];
          let failures=0;
          for(const file of files){
            if(!fs.existsSync(file)){console.error('MISSING',file);failures++;continue}
            const html=fs.readFileSync(file,'utf8');
            const opens=(html.match(/<script\b[^>]*>/gi)||[]);
            const closes=(html.match(/<\/script\s*>/gi)||[]);
            const htmlEnds=(html.match(/<\/html\s*>/gi)||[]);
            if(opens.length!==closes.length||htmlEnds.length!==1){console.error('HTML STRUCTURE FAIL',file);failures++}
            let checked=0;
            const re=/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
            for(const match of html.matchAll(re)){
              if(/\bsrc\s*=/.test(match[1])||!match[2].trim())continue;
              if(/\btype\s*=\s*["'](?:application\/json|importmap)/i.test(match[1]))continue;
              try{new vm.Script(match[2],{filename:file+'#script'+(++checked)})}
              catch(e){console.error('JS SYNTAX FAIL',file,e.message);failures++}
            }
            console.log(file,'scripts checked:',checked,'HTML endings:',htmlEnds.length);
          }
          if(failures)process.exit(1);
          NODE
      - name: Verify live, statistics and SEO invariants
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const home=fs.readFileSync('index.html','utf8');
          const map=fs.readFileSync('sitemap.xml','utf8');
          const ads=fs.readFileSync('ads.txt','utf8').trim();
          const assert=(condition,message)=>{if(!condition)throw Error(message)};
          assert(/LIVE_DRAW_ORDER=/.test(home),'Missing LIVE prize order');
          assert(/MB:\['g1','g2','g3','g4','g5','g6','g7','db'\]/.test(home),'MB rolling order must begin at G1');
          assert(home.includes("replace(/[đĐ]/g,'d')"),'Missing Dak Lak diacritic normalization');
          assert(home.includes("const displayStations=stations"),'LIVE must not add unscheduled station columns');
          assert(home.includes("data-live-station"),'Missing stable station selector');
          assert(home.includes("live-mb-grid .live-pending-cell"),'Missing MB rolling target selector');
          for(const page of ['thong-ke-2-so.html','thong-ke-3-so.html','thong-ke-4-so.html']){
            assert(fs.existsSync(page),'Missing statistics page '+page);
            assert(map.includes('https://xosothantaiapi.info/'+page),'Statistics page missing from sitemap: '+page);
            const html=fs.readFileSync(page,'utf8');
            assert(html.includes('365'),'365-day option missing from '+page);
            assert(/lottery_results/.test(html),'Statistics API missing from '+page);
          }
          assert(ads==='google.com, pub-8504828724795234, DIRECT, f08c47fec0942fa0','ads.txt publisher line mismatch');
          console.log('LIVE selectors, statistics pages, sitemap and ads.txt checks passed');
          NODE
