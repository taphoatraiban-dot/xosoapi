<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sổ số yêu thích | XOSOAPI</title><style>body{margin:0;background:#f5f6fa;color:#192235;font:16px system-ui}header{background:#aa142d;color:#fff;padding:17px}header a{color:#fff}main{max-width:850px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dfe2e9;border-radius:14px;padding:16px;margin:12px 0}label{display:block;font-weight:700;margin:10px 0 5px}input,select,button{font:inherit;border:1px solid #cbd0d9;border-radius:8px;padding:11px;box-sizing:border-box;max-width:100%}input{width:100%}button{background:#a9142c;color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{font-size:14px;color:#656c78}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e5e7eb}.item button{background:#545c68}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f8;padding:12px;border-radius:9px}h2{margin:8px 0}</style></head><body><header><a href="./index.html">← Trang chủ</a><h2>⭐ Sổ số yêu thích</h2></header><main><section class="card"><p class="muted">Lưu tối đa 100 số 2, 3 hoặc 4 chữ số trên thiết bị này. Không đồng bộ qua tài khoản hoặc thiết bị khác. Dữ liệu thống kê không dự đoán kết quả tương lai.</p><label for="number">Số muốn theo dõi</label><input id="number" maxlength="4" inputmode="numeric" placeholder="Ví dụ: 38, 378, 2378"><div class="grid"><div><label for="region">Miền</label><select id="region"><option value="ALL">Cả 3 miền</option><option value="MN">Miền Nam</option><option value="MT">Miền Trung</option><option value="MB">Miền Bắc</option></select></div><div><label for="days">Kiểm tra trong</label><select id="days"><option value="7">7 ngày</option><option value="30">30 ngày</option><option value="60">60 ngày</option></select></div></div><p><button id="add">+ Lưu số</button> <button id="check">Kiểm tra các số</button></p><p id="status" role="status" class="muted"></p></section><section class="card"><h3>Danh sách đang theo dõi</h3><div id="items"></div></section><section class="card"><h3>Lần kiểm tra gần nhất</h3><div id="results" class="result">Chưa kiểm tra.</div></section></main><script>
'use strict';const $=id=>document.getElementById(id),KEY='xosoapi-favorites-v1',API='https://zigpqddlhvjbjrwhfhaa.supabase.co',PUB='sb_publishable_U8VKihgNe0M7ff5KHB3Mvg_04ifZ7ni',widths={MN:{g8:2,g7:3,g6:4,g5:4,g4:5,g3:5,g2:5,g1:5,db:6},MT:{g8:2,g7:3,g6:4,g5:4,g4:5,g3:5,g2:5,g1:5,db:6},MB:{db:5,g1:5,g2:5,g3:5,g4:4,g5:4,g6:3,g7:2}};
function read(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&/^\d{2,4}$/.test(x.number)&&['ALL','MN','MT','MB'].includes(x.region)).slice(0,100):[]}catch(e){return []}}
function write(items){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){$('status').textContent='Không lưu được trên thiết bị. Kiểm tra chế độ duyệt riêng tư hoặc dung lượng lưu trữ.';return false}}
function render(){const root=$('items');root.replaceChildren();const items=read();if(!items.length){root.textContent='Chưa lưu số nào.';return}items.forEach((item,i)=>{const row=document.createElement('div');row.className='item';const span=document.createElement('span');span.textContent=item.number+' · '+(item.region==='ALL'?'Cả 3 miền':item.region);const btn=document.createElement('button');btn.textContent='Xóa';btn.onclick=()=>{const next=read();next.splice(i,1);if(write(next))render()};row.append(span,btn);root.append(row)})}
function add(){const number=$('number').value.trim(),region=$('region').value;if(!/^\d{2,4}$/.test(number)){$('status').textContent='Nhập đúng 2, 3 hoặc 4 chữ số.';return}const items=read();if(items.some(x=>x.number===number&&x.region===region)){$('status').textContent='Số này đã có trong sổ.';return}if(items.length>=100){$('status').textContent='Sổ đã đủ 100 số.';return}items.push({number,region});if(write(items)){$('status').textContent='Đã lưu số '+number;render()}}
function today(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v=k=>p.find(x=>x.type===k).value;return v('year')+'-'+v('month')+'-'+v('day')}
function before(date,days){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-days);return d.toISOString().slice(0,10)}
function extract(x,region,out=[],station='',depth=0){if(depth>12||x==null)return out;if(typeof x==='string'){if(/^[\[{]/.test(x.trim()))try{extract(JSON.parse(x),region,out,station,depth+1)}catch(e){}return out}if(typeof x!=='object')return out;if(Array.isArray(x)){x.forEach(v=>extract(v,region,out,station,depth+1));return out}const name=String(x.province||x.station||x.tinh||station||(region==='MB'?'Miền Bắc':'Chưa rõ đài'));if(x.prizes&&typeof x.prizes==='object')out.push({name,prizes:x.prizes});for(const [k,v] of Object.entries(x))if(k!=='prizes'&&v&&typeof v==='object')extract(v,region,out,name,depth+1);return out}
async function check(){const items=read();if(!items.length){$('status').textContent='Hãy lưu ít nhất một số trước.';return}const btn=$('check');btn.disabled=true;$('results').textContent='Đang đối chiếu dữ liệu...';$('status').textContent='Đang đọc kết quả';try{const regions=[...new Set(items.flatMap(x=>x.region==='ALL'?['MN','MT','MB']:[x.region]))],end=today(),from=before(end,Number($('days').value)-1),found=[],seen=new Set();let records=0;
for(const region of regions){let offset=0;while(true){const u=new URL(API+'/rest/v1/lottery_results');for(const [k,v] of Object.entries({select:'draw_date,data',region:'eq.'+region,draw_date:'gte.'+from,order:'draw_date.desc',limit:'500',offset:String(offset)}))u.searchParams.set(k,v);u.searchParams.append('draw_date','lte.'+end);const response=await fetch(u,{headers:{apikey:PUB,Accept:'application/json'},cache:'no-store'});if(!response.ok)throw Error(region+' HTTP '+response.status);const rows=await response.json();records+=rows.length;for(const row of rows)for(const draw of extract(row.data,region))for(const [raw,values] of Object.entries(draw.prizes)){let prize=raw.toLowerCase().replace(/[^a-z0-9]/g,'');if(prize==='special'||prize==='dacbiet')prize='db';if(!widths[region][prize])continue;const nums=Array.isArray(values)?values:[values];for(let i=0;i<nums.length;i++){const value=String(nums[i]).trim();if(!/^\d+$/.test(value)||value.length!==widths[region][prize])continue;for(const item of items){if(item.region!=='ALL'&&item.region!==region||!value.endsWith(item.number))continue;const key=[region,row.draw_date,draw.name,prize,i,value,item.number].join('|');if(seen.has(key))continue;seen.add(key);found.push(item.number+' · '+region+' · '+row.draw_date+' · '+draw.name+' · '+prize.toUpperCase()+' '+value)}}}if(rows.length<500)break;offset+=500;if(offset>=5000)throw Error('Dữ liệu quá nhiều, hãy chọn ít ngày hơn')}}
$('results').textContent=found.length?found.slice(0,300).join('\n')+(found.length>300?'\n... còn '+(found.length-300)+' kết quả':''):'Không thấy số đã lưu xuất hiện trong dữ liệu có thể đọc.';$('status').textContent='Đã đọc '+records+' bản ghi; tìm thấy '+found.length+' lượt khớp. Kết quả có thể chưa đầy đủ nếu nguồn thiếu kỳ.';
}catch(e){$('results').textContent='Lỗi: '+e.message}finally{btn.disabled=false}}
$('number').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)};$('add').onclick=add;$('check').onclick=check;render();
</script></body></html>
