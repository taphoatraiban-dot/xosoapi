<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ông Thần Tài — Xổ số LIVE</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#111827;color:#fff;font-family:Arial,sans-serif}body{display:flex;justify-content:center}.stage{width:min(100vw,540px);min-height:100vh;background:#fff;color:#172033}.hero{background:linear-gradient(135deg,#a90d17,#e32e28);padding:20px 14px;text-align:center;color:white}.hero h1{margin:0;font-size:28px;letter-spacing:.5px}.hero small{display:block;margin-top:8px;font-size:14px}.toolbar{display:flex;gap:6px;padding:10px;background:#f5f7fb}.toolbar button{flex:1;border:1px solid #d1d5db;background:white;border-radius:8px;padding:10px 2px;font-weight:800;color:#334155}.toolbar button.active{background:#be123c;color:white;border-color:#be123c}.meta{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:13px;background:#fff4f4}.status{font-weight:700;color:#a11622}.grid{padding:0 9px}.province{margin:12px 0 7px;background:#fee2e2;color:#991b1b;text-align:center;font-size:18px;font-weight:800;padding:9px}.prize{display:grid;grid-template-columns:85px 1fr;border:1px solid #d7dce3;border-bottom:0;min-height:52px}.prize:last-child{border-bottom:1px solid #d7dce3}.name{background:#f1f5f9;border-right:1px solid #d7dce3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}.numbers{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 5px;font-size:19px;font-weight:750;letter-spacing:1px}.numbers span{min-width:66px;text-align:center}.numbers .pending{color:#9ca3af}.prize.db .numbers{font-size:28px;color:#b91c1c}.foot{text-align:center;padding:15px 10px;background:#f8fafc;color:#64748b;font-size:12px;line-height:1.6}.notice{background:#fffbeb;color:#92400e;padding:10px;text-align:center;font-size:13px}.hidden{display:none}
</style></head><body><div class="stage"><header class="hero"><h1>ÔNG THẦN TÀI</h1><small>TRỰC TIẾP KẾT QUẢ XỔ SỐ • 3 MIỀN</small></header><nav class="toolbar"><button data-region="MN" class="active">MIỀN NAM</button><button data-region="MT">MIỀN TRUNG</button><button data-region="MB">MIỀN BẮC</button></nav><div class="meta"><span id="day">Ngày --/--/----</span><span id="status" class="status">ĐANG CHỜ DỮ LIỆU</span></div><div id="notice" class="notice">Chưa kết nối nguồn dữ liệu. Hãy cấu hình URL máy chủ trung gian.</div><main class="grid" id="results"></main><footer class="foot">Kết quả cập nhật từ nguồn dữ liệu được cấp quyền.<br>Chỉ hiển thị kết quả đã được xác nhận • Không tự tạo số trúng.<br><span id="updated">Chưa cập nhật</span></footer></div><script>
'use strict';
// CẤU HÌNH: Điền đường dẫn API TRUNG GIAN của chính bạn ở đây.
// API trung gian phải giữ API key ở máy chủ, không trả key cho trình duyệt.
// Ví dụ: '/api/live-results' nếu website có backend tương ứng.
const LIVE_ENDPOINT = 'https://zigpqddlhvjbjrwhfhaa.supabase.co/functions/v1/xoso-live-public';const POLL_MS = 5000;
const PRIZES = {MN:[['g8','Giải tám'],['g7','Giải bảy'],['g6','Giải sáu'],['g5','Giải năm'],['g4','Giải tư'],['g3','Giải ba'],['g2','Giải nhì'],['g1','Giải nhất'],['db','Đặc biệt']],MT:[['g8','Giải tám'],['g7','Giải bảy'],['g6','Giải sáu'],['g5','Giải năm'],['g4','Giải tư'],['g3','Giải ba'],['g2','Giải nhì'],['g1','Giải nhất'],['db','Đặc biệt']],MB:[['g7','Giải bảy'],['g6','Giải sáu'],['g5','Giải năm'],['g4','Giải tư'],['g3','Giải ba'],['g2','Giải nhì'],['g1','Giải nhất'],['db','Đặc biệt']]};
let region='MN';let latest=null;let fetching=false;
const $=id=>document.getElementById(id);
const localDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x;}
function render(data){const root=$('results');root.replaceChildren();const items=Array.isArray(data?.data)?data.data:[];if(!items.length){root.append(el('div','notice','Chưa có kết quả được xác nhận.'));return;}
for(const item of items){root.append(el('div','province',String(item.province||region)));for(const [key,label] of PRIZES[region]){const line=el('div','prize'+(key==='db'?' db':''));line.append(el('div','name',label));const nums=el('div','numbers');const values=Array.isArray(item.prizes?.[key])?item.prizes[key].filter(x=>/^\d+$/.test(String(x))):[];if(!values.length)nums.append(el('span','pending','•••••'));else for(const v of values)nums.append(el('span','',String(v)));line.append(nums);root.append(line);}}}
async function refresh(){if(fetching)return;const date=localDate();$('day').textContent='Ngày '+date.split('-').reverse().join('/');if(!LIVE_ENDPOINT){$('status').textContent='CHƯA CẤU HÌNH';render(null);return;}fetching=true;try{const url=new URL(LIVE_ENDPOINT,location.href);url.searchParams.set('region',region);url.searchParams.set('date',date);const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const json=await response.json();if(json.success!==true||json.region!==region||json.date!==date)throw Error('Phản hồi không hợp lệ hoặc sai ngày');latest=json;render(json);$('status').textContent=(json.numbers_count>0?'ĐÃ CÓ KẾT QUẢ':'ĐANG CHỜ KẾT QUẢ');$('notice').classList.add('hidden');$('updated').textContent='Cập nhật: '+new Date().toLocaleTimeString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'});}catch(e){$('status').textContent='MẤT KẾT NỐI';$('notice').textContent='Không nhận được dữ liệu mới. Giữ nguyên kết quả đã xác nhận trước đó.';$('notice').classList.remove('hidden');if(!latest)render(null);}finally{fetching=false;}}
document.querySelectorAll('[data-region]').forEach(b=>b.addEventListener('click',()=>{region=b.dataset.region;latest=null;document.querySelectorAll('[data-region]').forEach(x=>x.classList.toggle('active',x===b));render(null);refresh();}));render(null);refresh();setInterval(refresh,POLL_MS);
</script></body></html>
