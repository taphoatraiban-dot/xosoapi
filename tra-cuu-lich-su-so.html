<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tra cứu lịch sử số | XOSOAPI</title>
<style>body{font:16px system-ui;background:#f6f7fb;color:#182133;margin:0}header{background:#ad1428;color:white;padding:18px}main{max-width:850px;margin:auto;padding:14px}.card{background:white;border:1px solid #e4e5ec;border-radius:14px;padding:17px;margin:12px 0}label{display:block;font-weight:700;margin:10px 0 5px}input,select,button{font:inherit;padding:12px;border:1px solid #ccd0d9;border-radius:9px;max-width:100%;box-sizing:border-box}input{width:100%}button{background:#b1122c;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#606879;font-size:14px}table{width:100%;border-collapse:collapse}td,th{padding:10px 7px;border-bottom:1px solid #e4e5ec;text-align:left}a{color:inherit}#result{overflow-x:auto}</style></head>
<body><header><a href="./index.html">← Trang chủ</a><h2>🔎 Tra cứu lịch sử một con số</h2></header><main>
<section class="card"><p class="muted">Tìm số 2, 3 hoặc 4 chữ số ở cuối các giải của MN, MT, MB. Dữ liệu quá khứ không bảo đảm kết quả tương lai.</p><label for="number">Nhập số cần tra cứu</label><input id="number" inputmode="numeric" maxlength="4" placeholder="Ví dụ: 38, 378, 2378"><div class="grid"><div><label for="region">Miền</label><select id="region"><option value="ALL">Cả 3 miền</option><option value="MN">Miền Nam</option><option value="MT">Miền Trung</option><option value="MB">Miền Bắc</option></select></div><div><label for="days">Khoảng thời gian</label><select id="days"><option value="30">30 ngày</option><option value="60">60 ngày</option><option value="90">90 ngày</option><option value="365">365 ngày</option></select></div></div><p><button id="search">Tra cứu</button></p><p id="status" role="status" class="muted"></p></section>
<section class="card"><h3>Kết quả tìm thấy</h3><div id="result">Nhập số và bấm Tra cứu.</div></section></main>
<script>
'use strict';
const URL='https://zigpqddlhvjbjrwhfhaa.supabase.co',KEY='sb_publishable_U8VKihgNe0M7ff5KHB3Mvg_04ifZ7ni';
const $=id=>document.getElementById(id),widths={MN:{g8:2,g7:3,g6:4,g5:4,g4:5,g3:5,g2:5,g1:5,db:6},MT:{g8:2,g7:3,g6:4,g5:4,g4:5,g3:5,g2:5,g1:5,db:6},MB:{db:5,g1:5,g2:5,g3:5,g4:4,g5:4,g6:3,g7:2}};
function vnDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function dayBefore(n){const d=new Date(vnDate()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-n);return d.toISOString().slice(0,10)}
function extract(root,region){const out=[];const seen=new WeakSet();function walk(x,station='',depth=0){if(depth>12||x==null)return;if(typeof x==='string'){if(/^[\[{]/.test(x.trim()))try{walk(JSON.parse(x),station,depth+1)}catch(e){}return}if(typeof x!=='object')return;if(seen.has(x))return;seen.add(x);if(Array.isArray(x)){x.forEach(y=>walk(y,station,depth+1));return}const name=String(x.province||x.station||x.tinh||station||(region==='MB'?'Miền Bắc':'Chưa rõ đài'));if(x.prizes&&typeof x.prizes==='object'){const p={};for(const [k,v] of Object.entries(x.prizes)){let key=k.toLowerCase().replace(/[^a-z0-9]/g,'');if(key==='special'||key==='dacbiet')key='db';if(!widths[region][key])continue;const nums=Array.isArray(v)?v:[v];p[key]=nums.map(n=>String(n).trim()).filter(n=>/^\d+$/.test(n)&&n.length===widths[region][key])}out.push({station:name,prizes:p})}for(const [k,v] of Object.entries(x))if(k!=='prizes'&&v&&typeof v==='object')walk(v,name,depth+1)}walk(root);return out}
function td(tr,text,tag='td'){const e=document.createElement(tag);e.textContent=text;tr.append(e)}
async function search(){const num=$('number').value.trim();if(!/^\d{2,4}$/.test(num)){$('status').textContent='Vui lòng nhập đúng 2, 3 hoặc 4 chữ số.';return}
const btn=$('search');btn.disabled=true;$('result').textContent='';$('status').textContent='Đang đọc dữ liệu...';try{const regions=$('region').value==='ALL'?['MN','MT','MB']:[$('region').value],from=dayBefore(Number($('days').value)-1),today=vnDate(),found=[],seen=new Set();let total=0;
for(const region of regions){let offset=0;while(true){const u=new URL(URL+'/rest/v1/lottery_results');u.searchParams.set('select','draw_date,data');u.searchParams.set('region','eq.'+region);u.searchParams.set('draw_date','gte.'+from);u.searchParams.set('draw_date','lte.'+today);u.searchParams.set('order','draw_date.desc');u.searchParams.set('limit','500');u.searchParams.set('offset',String(offset));const response=await fetch(u,{headers:{apikey:KEY,Accept:'application/json'},cache:'no-store'});if(!response.ok)throw Error('Không đọc được '+region+' (HTTP '+response.status+'). Kiểm tra quyền đọc dữ liệu.');const rows=await response.json();total+=rows.length;for(const row of rows){for(const draw of extract(row.data,region)){for(const [prize,nums] of Object.entries(draw.prizes)){nums.forEach((value,index)=>{if(value.endsWith(num)){const key=[region,row.draw_date,draw.station,prize,index,value].join('|');if(!seen.has(key)){seen.add(key);found.push({region,date:row.draw_date,station:draw.station,prize,value})}}})}}}if(rows.length<500)break;offset+=500;if(offset>=5000)throw Error('Quá nhiều dữ liệu; hãy chọn khoảng ngày ngắn hơn.')}}}
found.sort((a,b)=>b.date.localeCompare(a.date));$('status').textContent='Tìm thấy '+found.length+' lượt xuất hiện trong '+total+' bản ghi dữ liệu đã đọc.';if(!found.length){$('result').textContent='Không tìm thấy số này trong dữ liệu có thể đọc.';return}const table=document.createElement('table'),head=document.createElement('tr');['Ngày','Miền','Đài','Giải','Số'].forEach(x=>td(head,x,'th'));table.append(head);found.forEach(x=>{const tr=document.createElement('tr');[x.date,x.region,x.station,x.prize.toUpperCase(),x.value].forEach(y=>td(tr,y));table.append(tr)});$('result').append(table)
}catch(e){$('status').textContent='Lỗi: '+e.message}finally{btn.disabled=false}}
$('number').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)});$('search').addEventListener('click',search);
</script></body></html>
