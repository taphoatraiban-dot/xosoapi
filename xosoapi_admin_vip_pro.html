<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XOSOAPI — Admin VIP/PRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#081522;color:#eff6ff;font:15px system-ui,Arial}main{max-width:920px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#a1d8ff}.card{background:#12243a;border:1px solid #2c4664;border-radius:14px;padding:16px;margin:14px 0}button{background:#06956f;color:#fff;border:none;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}button:disabled{opacity:.6}h1{font-size:25px}h2{font-size:18px;margin:0 0 9px}.muted{color:#b1c1d4}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:14px}.row div{overflow-wrap:anywhere}.pill{display:inline-block;background:#5e451c;color:#ffe19c;padding:5px 9px;border-radius:99px}.approved{background:#13523d;color:#a8f2c8}.err{color:#ffc3c3}.msg{padding:12px;border-radius:10px;background:#243e54}select{background:#172c43;color:white;padding:10px;border:1px solid #45617b;border-radius:8px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main><header><h1>✦ Admin VIP / PRO</h1><a href="./admin.html">Admin API Key</a></header><p class="muted">Chỉ dùng để quản lý gói thống kê VIP 39.000đ và PRO 79.000đ. Không thay đổi các gói API Key hiện tại.</p><div id="status" class="msg">Đang kiểm tra đăng nhập và quyền Admin…</div><section class="card"><label for="filter">Trạng thái: </label><select id="filter"><option value="pending">Chờ duyệt</option><option value="all">Tất cả</option><option value="approved">Đã duyệt</option><option value="rejected">Từ chối</option></select><button id="reload">↻ Tải lại</button></section><div id="orders"></div></main><script>
const sb=supabase.createClient('https://zigpqddlhvjbjrwhfhaa.supabase.co','sb_publishable_U8VKihgNe0M7ff5KHB3Mvg_04ifZ7ni');
const $=id=>document.getElementById(id);let orders=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>s?new Date(s).toLocaleString('vi-VN'):'—';
const amount=n=>Number(n||0).toLocaleString('vi-VN')+'đ';
function status(t,error=false){$('status').className=error?'msg err':'msg';$('status').textContent=t}
function render(){let f=$('filter').value,items=orders.filter(o=>f==='all'||o.status===f);$('orders').innerHTML=items.length?items.map(o=>`<article class="card"><h2>${esc(o.plan_code?.toUpperCase())} • ${amount(o.amount)} <span class="pill ${o.status==='approved'?'approved':''}">${esc(o.status)}</span></h2><div class="row"><div><b>User ID:</b> ${esc(o.user_id)}</div><div><b>Mã yêu cầu:</b> ${esc(o.id)}</div><div><b>Tạo lúc:</b> ${esc(dt(o.created_at))}</div><div><b>Đã xử lý:</b> ${esc(dt(o.processed_at))}</div><div style="grid-column:1/-1"><b>Nội dung chuyển khoản:</b> ${esc(o.transfer_note)}</div></div>${o.status==='pending'?`<p class="muted">Chỉ duyệt sau khi kiểm tra giao dịch thực tế tại ngân hàng.</p><button class="approve" data-id="${esc(o.id)}">✓ Đã nhận tiền — Duyệt 30 ngày</button>`:''}</article>`).join(''):'<div class="card muted">Không có đơn phù hợp.</div>';document.querySelectorAll('.approve').forEach(btn=>btn.addEventListener('click',()=>approve(btn.dataset.id,btn)))}
async function load(){status('Đang tải danh sách…');let {data,error}=await sb.rpc('admin_list_website_memberships');if(error){status('Không đọc được danh sách: '+error.message,true);return}orders=data||[];render();status('Đã tải '+orders.length+' yêu cầu.')} 
async function approve(id,btn){const o=orders.find(x=>x.id===id);if(!o)return;if(!confirm('Bạn đã KIỂM TRA thực nhận '+amount(o.amount)+' từ khách và muốn kích hoạt '+o.plan_code.toUpperCase()+' trong 30 ngày?'))return;btn.disabled=true;const {data,error}=await sb.rpc('approve_website_membership',{p_request_id:id});if(error){status('Duyệt thất bại: '+error.message,true);btn.disabled=false;return}status(data||'Đã duyệt thành công.');await load()}
$('reload').onclick=load;$('filter').onchange=render;
(async()=>{const {data:{session},error}=await sb.auth.getSession();if(error||!session?.user){status('Bạn chưa đăng nhập. Mở trang đăng nhập trước.',true);$('orders').innerHTML='<p><a href="./login.html">Đăng nhập</a></p>';return}await load()})();
</script></body></html>
