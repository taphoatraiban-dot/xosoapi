
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sổ kết quả 30 ngày - XOSOAPI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf5f8;color:#163d50;font-family:Arial,sans-serif}
header{background:linear-gradient(120deg,#05486b,#008c92);color:white;padding:22px 15px}
header a{color:white;text-decoration:none}
header h2{margin:15px 0 6px}
main{max-width:850px;margin:auto;padding:14px}
.box{background:white;padding:15px;border-radius:13px;margin-bottom:13px;box-shadow:0 2px 8px #0001}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:13px 4px;border:0;border-radius:9px;background:#e5f1f5;color:#12475e;font-weight:bold;font-size:14px}
.tabs .on{background:#00868d;color:white}
h3{font-size:17px}
input{padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.days{display:flex;overflow:auto;gap:7px;padding:12px 0}
.days button{flex-shrink:0;padding:10px;border:1px solid #cee1e8;background:#edf7fa;border-radius:8px}
.days .on{background:#00868d;color:white}
.status{font-size:14px;padding:12px;background:#e9f5f7;border-radius:8px}
.station{border:1px solid #d6e6eb;border-radius:10px;margin:14px 0;overflow:hidden}
.station h3{margin:0;background:#d9f1f2;padding:13px}
.prize{display:grid;grid-template-columns:75px 1fr;border-top:1px solid #eee}
.prize b{background:#f2f8fa;text-align:center;padding:12px 4px}
.nums{display:flex;flex-wrap:wrap;gap:12px;padding:12px}
.num{font-weight:bold;font-size:18px}
.special{color:#d02525;font-size:22px}
.empty{text-align:center;padding:25px;color:#687d87}
</style>
</head>
<body>
<header>
<a href="/">← Trang chủ</a>
<h2>📅 SỔ KẾT QUẢ 30 NGÀY</h2>
<div>XOSOAPI - Kết quả xổ số 3 miền</div>
</header>

<main>
<section class="box">
<div class="tabs">
<button class="on" data-r="MN">Miền Nam</button>
<button data-r="MT">Miền Trung</button>
<button data-r="MB">Miền Bắc</button>
</div>

<h3 id="heading">Kết quả Miền Nam</h3>
<label>Chọn ngày: <input id="date" type="date"></label>
<div id="days" class="days"></div>
<div id="status" class="status">Đang tải kết quả...</div>
</section>

<section class="box" id="results"></section>
</main>

<script>
const API="https://zigpqddlhvjbjrwhfhaa.supabase.co/functions/v1/xosoapi";
const $=id=>document.getElementById(id);
const regions={MN:"Miền Nam",MT:"Miền Trung",MB:"Miền Bắc"};
const labels={db:"Đặc biệt",g1:"Giải 1",g2:"Giải 2",g3:"Giải 3",g4:"Giải 4",g5:"Giải 5",g6:"Giải 6",g7:"Giải 7",g8:"Giải 8"};
const order=["db","g1","g2","g3","g4","g5","g6","g7","g8"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const vn=s=>s.split("-").reverse().join("/");
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

let region="MN";
let selected="";
let requestId=0;

const now=new Date();
now.setHours(12,0,0,0);
const dates=Array.from({length:30},(_,i)=>{
const d=new Date(now);
d.setDate(d.getDate()-i);
return iso(d);
});
selected=dates[0];

function drawDays(){
$("days").innerHTML=dates.map(d=>
`<button data-day="${d}" class="${selected===d?"on":""}">${vn(d).slice(0,5)}</button>`
).join("");
$("date").value=selected;
}

function render(data){
const rows=Array.isArray(data)?data:(data&&typeof data==="object"?[data]:[]);
if(!rows.length){
$("results").innerHTML='<div class="empty">Ngày này chưa có kết quả.</div>';
return;
}
const lengths=region==="MB"
?{db:5,g1:5,g2:5,g3:5,g4:4,g5:4,g6:3,g7:2}
:{db:6,g1:5,g2:5,g3:5,g4:5,g5:4,g6:4,g7:3,g8:2};

$("results").innerHTML=rows.map((item,i)=>{
const name=escapeHTML(item.province||item.name||item.station||(region==="MB"?"Miền Bắc":"Đài "+(i+1)));
const prizes=item.prizes||item.results||{};
const html=order.filter(k=>prizes[k]!=null).map(k=>{
let nums=Array.isArray(prizes[k])?prizes[k]:[prizes[k]];
nums=nums.filter(n=>n!=null&&String(n).trim()!=="");
const valid=nums.filter(n=>/^\d+$/.test(String(n))&&String(n).length===lengths[k]);
if(valid.length)nums=valid;
return `<div class="prize"><b>${labels[k]}</b><div class="nums">${nums.map(n=>`<span class="num ${k==="db"?"special":""}">${escapeHTML(n)}</span>`).join("")}</div></div>`;
}).join("");
return `<div class="station"><h3>${name}</h3>${html||'<div class="empty">Chưa có chi tiết giải</div>'}</div>`;
}).join("");
}

async function load(){
const current=++requestId;
$("heading").textContent="Kết quả "+regions[region]+" - "+vn(selected);
$("status").textContent="Đang tải kết quả...";
$("results").innerHTML="";
try{
const ctrl=new AbortController();
const timer=setTimeout(()=>ctrl.abort(),16000);
let res;
try{
res=await fetch(API+"?region="+region+"&date="+selected,{
signal:ctrl.signal,
headers:{Accept:"application/json"}
});
}finally{clearTimeout(timer)}
if(!res.ok)throw Error("HTTP "+res.status);
const json=await res.json();
if(current!==requestId)return;
if(json.success===false)throw Error(json.message||"API chưa có kết quả");
render(json.data??json.results??[]);
$("status").textContent="Kết quả "+regions[region]+" ngày "+vn(selected);
}catch(err){
if(current!==requestId)return;
$("status").textContent="Không tải được kết quả: "+err.message;
$("results").innerHTML='<div class="empty">Vui lòng thử lại hoặc chọn ngày khác.</div>';
}
}

document.querySelectorAll("[data-r]").forEach(b=>{
b.onclick=()=>{
region=b.dataset.r;
document.querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on",x===b));
load();
};
});

$("days").onclick=e=>{
const b=e.target.closest("[data-day]");
if(!b)return;
selected=b.dataset.day;
drawDays();
load();
};

$("date").min=dates[29];
$("date").max=dates[0];
$("date").onchange=e=>{
if(!dates.includes(e.target.value)){
alert("Chỉ chọn ngày trong 30 ngày gần nhất");
e.target.value=selected;
return;
}
selected=e.target.value;
drawDays();
load();
};

drawDays();
load();
</script>
</body>
</html>
